<svg viewBox="0 0 920 630" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, Consolas, 'Courier New', monospace">
  <defs>
    <style>
      .label { fill: #e8a24c; font-weight: bold; font-size: 15px; }
      .value { fill: #e8e8e8; font-size: 15px; }
      .heading { fill: #5fb3f5; font-size: 17px; font-weight: bold; }
      .username { fill: #4fd67a; font-size: 22px; font-weight: bold; }
      .at { fill: #8892b0; font-size: 22px; }
      .site { fill: #5fb3f5; font-size: 22px; font-weight: bold; }
      .titlebar { fill: #8892b0; font-size: 13px; }
      .dot { r: 6; }
    </style>
    <clipPath id="rounded">
      <rect x="0" y="0" width="920" height="630" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- background -->
    <rect x="0" y="0" width="920" height="630" fill="#0d1117"/>

    <!-- title bar -->
    <rect x="0" y="0" width="920" height="40" fill="#161b22"/>
    <circle class="dot" cx="28" cy="20" fill="#ff5f56"/>
    <circle class="dot" cx="50" cy="20" fill="#ffbd2e"/>
    <circle class="dot" cx="72" cy="20" fill="#27c93f"/>
    <text x="460" y="25" text-anchor="middle" class="titlebar">punam46@github: ~$ neofetch</text>

    <!-- header -->
    <text x="28" y="82" class="username">punam46</text>
    <text x="140" y="82" class="at">@</text>
    <text x="160" y="82" class="site">github</text>
    <line x1="28" y1="100" x2="892" y2="100" stroke="#30363d" stroke-width="1"/>

    <!-- info rows -->
    <text x="28" y="150" class="label">Now</text>
    <text x="165" y="150" class="value">Frontend Developer</text>

    <text x="28" y="182" class="label">Education</text>
    <text x="165" y="182" class="value">MCA • 2028</text>

    <text x="28" y="214" class="label">Location</text>
    <text x="165" y="214" class="value">Nashik</text>

    <!-- stack heading -->
    <text x="28" y="267" class="heading">- Stack</text>
    <line x1="28" y1="280" x2="892" y2="280" stroke="#30363d" stroke-width="1"/>

    <text x="28" y="317" class="label">Languages</text>
    <text x="165" y="317" class="value">Python, JavaScript, C</text>

    <text x="28" y="349" class="label">Frontend</text>
    <text x="165" y="349" class="value">HTML, CSS, React</text>

    <text x="28" y="381" class="label">Backend</text>
    <text x="165" y="381" class="value">Node, Express, Python</text>

    <text x="28" y="413" class="label">AI / ML</text>
    <text x="165" y="413" class="value">GenAI, RAG, Watsonx</text>

    <!-- highlights heading -->
    <text x="28" y="466" class="heading">- Highlights</text>
    <line x1="28" y1="479" x2="892" y2="479" stroke="#30363d" stroke-width="1"/>

    <circle cx="36" cy="505" r="4" fill="#4fd67a"/>
    <text x="52" y="510" class="value">Developer &amp; Content Creator</text>

    <circle cx="36" cy="537" r="4" fill="#4fd67a"/>
    <text x="52" y="542" class="value">AI &amp; Cloud Enthusiast</text>

    <circle cx="36" cy="569" r="4" fill="#4fd67a"/>
    <text x="52" y="574" class="value">Frontend Developer @ BK Times</text>

    <circle cx="36" cy="601" r="4" fill="#4fd67a"/>
    <text x="52" y="606" class="value">Open Source Contributor</text>

  </g>
</svg>
